name: Build and test
on: [push, pull_request]

jobs:
  build-test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-24.04-arm
          - ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - uses: eessi/github-action-eessi@v3
    - name: Test EESSI
      run: |
        module load CMake HDF5 buildenv

        mkdir build
        cd build
        cmake ..
        make -j
        ctest --output-on-failure --verbose
      shell: bash
